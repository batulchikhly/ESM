spring:
  application:
    name: acme-salary-management
  datasource:
    url: jdbc:postgresql://localhost:5432/salarymanagement
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    random-seed: ${APP_SEED_RANDOM_SEED:20260922}
    version: ${APP_SEED_VERSION:v1}
    employee-count: ${APP_SEED_EMPLOYEE_COUNT:10000}
  security:
    jwt-secret: ${JWT_SECRET:acme-local-jwt-secret-change-before-production-2026-32-bytes-minimum-key}
    jwt-expiration: ${JWT_EXPIRATION:PT15M}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
