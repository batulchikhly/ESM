spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:salarymanagement;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  seed:
    enabled: false
    random-seed: 20260922
    version: v1
    employee-count: 10000
  security:
    jwt-secret: test-secret-that-is-long-enough-for-jwt-signing
    jwt-expiration: PT15M
  cors:
    allowed-origins: http://localhost:5173
