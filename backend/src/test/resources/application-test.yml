spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:salarymanagement;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

app:
  security:
    jwt-secret: test-secret-that-is-long-enough-for-jwt-signing
    jwt-expiration: PT15M
  cors:
    allowed-origins: http://localhost:5173
